<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>payoo || Login</title>
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon">

    <!-- Tailwind and Daysi Ul CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Outfit Font link -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- Fontawesome link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        * {
            font-family: "Outfit", sans-serif;
        }
    </style>
</head>
<body>
    <!-- Login Page -->
    <section class="min-h-screen max-w-md mx-auto bg-base-200 pt-32">
        <div class="mb-7">
            <img src="./assets/Logo-full.png" alt="" class="mx-auto">
        </div>
        <fieldset class="fieldset bg-white border-base-300  rounded-box w-xs border p-7 mx-auto">
    
            <label class="font-bold text-base">Mobile Number</label>
            <input id="login-number" type="number" class="bg-base-200 input mb-5 rounded-3xl" placeholder="Enter your number" />

            <label class="font-bold text-base">4 Digit Pin</label>
            <input id="login-pin" type="number" class="bg-base-200 input rounded-3xl" placeholder="Enter 4 Digit Pin" />

            <button id="login-btn" class="btn btn-primary mt-4 font-bold text-base rounded-3xl">Login</button>
        </fieldset>
    </section>
    
    <script src="./script/login.js"></script>
</body>
</html>
